# Builds the app and every league's data (scripts/build-static.ts) and publishes it to GitHub Pages.
# Pages serve from a CDN, so nothing has to wake up; live scores in between builds come from
# Sleeper directly in the browser.
#
# The site can also load a Sleeper league that isn't set up here: it starts this workflow with
# guest_league (web/src/lib/github.ts). That temporary league is rebuilt with the others until the
# site asks for a different one. Saving a league from the site (save_league / forget_league) commits
# config/sleeper.json first, so this and every later build includes it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      guest_league:
        description: 'Temporary Sleeper league to build too, until another replaces it (none = drop it; blank keeps the current one)'
        required: false
        type: string
        default: ''
      save_league:
        description: 'Sleeper league to save in config/sleeper.json (built every time, listed in the app)'
        required: false
        type: string
        default: ''
      forget_league:
        description: 'Saved Sleeper league to remove from config/sleeper.json'
        required: false
        type: string
        default: ''
  schedule:
    # Times are UTC. Sunday games: every 10 minutes.
    - cron: '*/10 13-23 * * 0'
    # Thursday, Sunday and Monday night games (they end after midnight UTC): every 15 minutes.
    - cron: '*/15 0-5 * * 1,2,5'
    # Saturday games in December and January.
    - cron: '*/15 17-23 * 12,1 6'
    # Otherwise every three hours, for injury news, waivers and projection updates.
    - cron: '23 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Saving or removing a league from the app's league switcher. A push made with the workflow token
  # doesn't start another deploy; the deploy job below builds from this commit.
  save:
    if: inputs.save_league != '' || inputs.forget_league != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: save
        name: Update config/sleeper.json
        run: node scripts/save-league.ts
        env:
          SAVE_LEAGUE: ${{ inputs.save_league }}
          FORGET_LEAGUE: ${{ inputs.forget_league }}

      - name: Commit
        env:
          MESSAGE: ${{ steps.save.outputs.message }}
        run: |
          git add config/sleeper.json
          if git diff --cached --quiet; then echo "Nothing to change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "$MESSAGE"
          git pull --rebase --quiet
          git push

  deploy:
    needs: save
    # Off until GitHub Pages is turned on for the repository (Pages on a private repository needs a paid
    # plan); then set the repository variable PAGES_ENABLED to true. A skipped job uses no Actions minutes.
    # Runs when there was nothing to save, too (the save job is skipped then).
    if: ${{ !cancelled() && vars.PAGES_ENABLED == 'true' && (needs.save.result == 'success' || needs.save.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The branch as it is now, so a league the save job just committed is included.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - id: pages
        uses: actions/configure-pages@v6

      # Sleeper/nflverse responses (revalidated with stored ETags) and saved pregame forecasts.
      - name: Restore data cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache
            data/snapshots
          key: sla-data-${{ github.run_id }}
          restore-keys: sla-data-

      - name: Pull pregame forecasts saved by earlier deploys
        run: node scripts/pull-snapshots.ts
        env:
          SLA_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Build app and league data
        run: npm run build:static
        env:
          SLA_BASE: ${{ steps.pages.outputs.base_path }}/
          SLA_SITE_URL: ${{ steps.pages.outputs.base_url }}
          SLA_GUEST_LEAGUE: ${{ inputs.guest_league }}
          # ESPN claims from the site run as .github/workflows/claim.yml in this repository.
          VITE_GITHUB_REPO: ${{ github.repository }}
          # Claims need no per-device token setup when the CLAIM_TOKEN secret is set (a fine-grained
          # Actions token for this repo). Note: baked into a static build, it is public to everyone
          # who can open the site.
          VITE_GITHUB_TOKEN: ${{ secrets.CLAIM_TOKEN }}
          # Optional: ESPN cookies as repository secrets instead of config/espn.json.
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            .cache
            data/snapshots
          key: sla-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
