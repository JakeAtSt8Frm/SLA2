# Weekly retrain: folds the week just finished into every league's model (same protocol as
# `npm run research`: tune on 2024, report 2025 and this season out of sample, then fit the
# production model on everything), checks it, commits the model files and redeploys.
name: Retrain models

on:
  workflow_dispatch:
  schedule:
    # Wednesdays 13:00 UTC: Monday night's game is final and early stat corrections are in.
    - cron: '0 13 * * 3'

permissions:
  contents: write
  actions: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/requirements.txt

      - run: npm ci --no-audit --no-fund

      - name: Python environment
        run: python -m venv research/.venv && research/.venv/bin/pip install -q -r research/requirements.txt

      # Six seasons of Sleeper stats and projections plus nflverse injury reports: downloaded once.
      - name: Restore research data
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            research/cache
          key: sla-research-${{ github.run_id }}
          restore-keys: sla-research-

      - name: Fetch new weeks
        run: npm run research:fetch

      - name: Train the Sleeper league model
        run: node research/build-dataset.ts && research/.venv/bin/python research/train.py && node research/backtest.ts

      - name: Train the ESPN league models
        run: npm run research:espn

      - name: Save research data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            research/cache
          key: sla-research-${{ github.run_id }}

      # Typecheck and tests, including the check that the TypeScript runtime reproduces the trees.
      - run: npm run check

      - name: Commit the new models
        id: commit
        run: |
          git add model research/*.meta.json research/availability*.json
          if git diff --cached --quiet; then echo "No model changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Retrain models through the latest completed week"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow token doesn't start other workflows; ask for the deploy directly.
      - name: Redeploy with the new models
        if: steps.commit.outputs.changed == 'true' && vars.PAGES_ENABLED == 'true'
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
