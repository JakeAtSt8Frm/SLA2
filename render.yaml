# Render Blueprint: one free web service that serves both the app and the API.
services:
  - type: web
    name: sla2
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SLA_DEFAULT_LEAGUE
        value: "1312656463549726720"
      # Keep the heap well inside the free instance's 512 MB (measured peak ≈ 330 MB).
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
